# Local Bedrock Converse setup: Nova 2 Lite for every text generation task.
# docker compose -f compose.yaml -f compose.nova-local.yaml up -d --build --no-deps backend
services:
  backend:
    environment:
      RESUME_EXTRACTOR: bedrock_converse
      BEDROCK_EXTRACTION_MODEL: ${BEDROCK_EXTRACTION_MODEL:-us.amazon.nova-2-lite-v1:0}
      BEDROCK_RAG_MODEL: ${BEDROCK_RAG_MODEL:-us.amazon.nova-2-lite-v1:0}
      BEDROCK_TEXT_MODEL: ${BEDROCK_TEXT_MODEL:-us.amazon.nova-2-lite-v1:0}
      ASSESSMENT_AI_GENERATION: ${ASSESSMENT_AI_GENERATION:-bedrock_converse}
      ROADMAP_PROVIDER: bedrock_converse
      ROADMAP_MODEL_ID: ${BEDROCK_ROADMAP_MODEL:-us.amazon.nova-2-lite-v1:0}
      ROADMAP_AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ROADMAP_PRICE_INPUT_PER_MTOK: ${ROADMAP_PRICE_INPUT_PER_MTOK:-0.33}
      ROADMAP_PRICE_OUTPUT_PER_MTOK: ${ROADMAP_PRICE_OUTPUT_PER_MTOK:-2.75}
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
