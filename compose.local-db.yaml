# Temporary backend override for development against the local Docker PostgreSQL.
# Start with: docker compose -f compose.yaml -f compose.local-db.yaml up -d backend
services:
  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_CONTAINER_PORT:-5432}
      DB_NAME: ${DB_NAME:-glowjob}
      DB_USER: ${DB_USER:-glowjob}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
